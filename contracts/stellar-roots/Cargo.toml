[package]
name = "vet402-stellar-roots"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One Merkle root per UTC day over vet402's public purchase records on Stellar. Writer only, once per day. Holds no funds."
publish = false

[lib]
# rlib lets the escrow tests register this contract. cdylib stays for stellar contract build.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
