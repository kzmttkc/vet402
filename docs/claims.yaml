# ============================================================
# vet402 — 公開面の事実主張の登録簿
#
# なぜ在るか: 2026-08-13 の LP は「every catalog-listed x402 endpoint, probed daily」と
# 書いていた。2026-08-20 に /observatory/state が同じサイトへ実測（18.8% = 2,750/14,662）を
# 出したが、主張は 20 日間そのまま公開され続けた。その間に走った 6 回の監査（セキュリティ・
# SEO・UX・資金）はどれも気づかず、外部の観測所 probe402 が 2026-09-01 に読み取り 09-03 に
# 公開した。散文の主張と機械が出す実測を突き合わせる常設の検査が無かったのが原因。
#
# 使い方:
#   - tests/claims-registry.test.ts が公開面を走査し、未登録の断定があれば fail する
#   - npm run claims:canary が check を本番 API に当て、偽になった主張を報告する
#   - check を書けない主張は check: null と why_unverifiable を必ず書く
#     （確かめられないことを確かめたふりをしない）
# ============================================================

# 断定語を含むが、網羅・頻度の主張ではない用法。理由必須。
allow_phrases:
  - phrase: "-only"
    why: "read-only / append-only / allow-only / API-only のような複合語。範囲を狭める語であって、網羅や頻度を主張しない"
  - phrase: " at all"
    why: "英語の慣用句（「そもそも」）。網羅の主張ではない"
  - phrase: " only after "
    why: "条件を狭める限定用法。主張を強めない"
  - phrase: " only if "
    why: "条件を狭める限定用法。主張を強めない"
  - phrase: " only when "
    why: "条件を狭める限定用法。主張を強めない"
  - phrase: " only as long as "
    why: "保持期間を狭める限定用法（プライバシー方針）"
  - phrase: " only for "
    why: "対象を狭める限定用法"
  - phrase: " only once "
    why: "回数を狭める限定用法"
  - phrase: " only a snapshot"
    why: "測定結果の射程を狭める免責。過大主張の逆"
  - phrase: " only these two"
    why: "採用する事実を2つに狭める限定用法"
  - phrase: " only proves control"
    why: "署名が証明する範囲を狭める限定用法"
  - phrase: " only partially measured"
    why: "測定の不完全さを認める限定用法"
  - phrase: " only lower the ceiling"
    why: "上限を下げる方向にしか効かないという限定用法"
  - phrase: " only shipped in 2025"
    why: "外部プロトコルの出荷時期の記述。当社の運用主張ではない"
  - phrase: " only rows with a receipt"
    why: "図の対象行を狭める限定用法"
  - phrase: " only what has not shipped"
    why: "節の範囲を未出荷分に狭める限定用法"
  - phrase: " only the checks that completed"
    why: "スコアの根拠を狭める限定用法"
  - phrase: " only on a critical failure"
    why: "通知条件を狭める限定用法"
  - phrase: " only 2,750 of 14,662"
    why: "2026-09-02 の訂正記事が引用している実測値そのもの（corrections の本文で別途登録）"
  - phrase: " only thing you have to supply"
    why: "SDK 設定の説明。当社の測定頻度・網羅の主張ではない"
  - phrase: " counts only"
    why: "集計の対象を狭める限定用法"
  - phrase: "counts only "
    why: "集計の対象を狭める限定用法"
  - phrase: "purposes only"
    why: "法的免責の限定用法（informational purposes only）"
  - phrase: "use only"
    why: "利用条件を狭める限定用法（business use only）"
  - phrase: "Aggregate only"
    why: "表の粒度バッジ。集計値しか出さないという限定"
  - phrase: "Facts only"
    why: "「スコアではなく事実だけ」という限定バッジ"
  - phrase: "Global acts only"
    why: "対象をグローバル操作に狭める限定バッジ"
  - phrase: "changes only "
    why: "通知対象を狭める限定用法"
  - phrase: "quota only "
    why: "課金制御の対象を狭める限定用法"
  - phrase: "and only after you log in"
    why: "cookie 設置条件を狭める限定用法"
  - phrase: "processes only the data"
    why: "処理範囲を狭める限定用法（DPA 記述）"
  - phrase: "the only number that matters"
    why: "編集上の強調（何を重視するかの立場表明）で、測定の網羅・頻度の主張ではない"
  - phrase: "the only band the SDK"
    why: "既定ポリシーが通す帯域を1つに狭める限定用法"
  - phrase: "only an"
    why: "既定ポリシーが通す条件を狭める限定用法（Only an ALLOW passes）"
  - phrase: "All posts"
    why: "ブログ一覧へのリンク文言。UI ラベル"
  - phrase: "Show all"
    why: "行を展開するボタンのラベル。UI ラベル"
  - phrase: "All-time API queries"
    why: "ダッシュボードの指標名。UI ラベル"
  - phrase: "Daily history"
    why: "節の見出し。中身の主張は本文側で登録している"
  - phrase: "all keys you"
    why: "アカウント内の全キーに責任が及ぶという契約条項（利用規約）"
  - phrase: "all keys on an account"
    why: "クォータの共有範囲の説明（API 仕様）"
  - phrase: "across every key on"
    why: "クォータの共有範囲の説明（API 仕様）"
  - phrase: "all claims relating to"
    why: "責任総額の上限を定める法的条項"
  - phrase: "all external figures"
    why: "自社ベンチマークを外部指標から除外するという限定"
  - phrase: "all chains"
    why: "図の軸ラベル（全チェーン合算）。頻度・網羅の主張は state 本文で登録している"
  - phrase: "all denied unless"
    why: "既定で拒否するというフェイルクローズの説明"
  - phrase: "all from"
    why: "npm パッケージの発行元が同一という説明"
  - phrase: "were passed"
    why: "0% の読み方を説明する引用（「all were passed」ではない、と否定している側）"
  - phrase: "stated at all"
    why: "節の見出し（なぜこれを明記するか）"

