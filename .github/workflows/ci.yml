name: ci

# 2026-08-05. Vouch had no CI at all — no .github directory, no test script,
# and exactly one test file in the whole repository (the SDK's spend-guard).
# The 1,350-line scoring core, which is the entire product, had none.
#
# That matters more here than in a normal codebase because of what the code
# does when it breaks: the engine is fail-closed, so a regression does not
# throw — it flips every verdict to BLOCK, or (far worse) lets an
# "unavailable" signal through as ALLOW. Both are silent. A customer gating
# x402 settlement on this API would keep settling payments while our RPC was
# down and find out from their losses, not from an error.
#
# No database and no RPC are needed: the suites deliberately test the pure
# modules (verdict / helpers / x402 settlement extraction), which is why those
# functions were moved out of the DB-importing modules in the first place.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 2026-09-07: 末尾の refresh-numbers --check が check: "derive" の id（コミット数・会期のファイル数）を
          # git から**その場で導出**する。既定の depth 1 では `git rev-list --count HEAD` が 1、
          # タグ pre-ethonline-2026 も無く `pre-ethonline-2026..HEAD` は fatal（--depth 1 の clone で実測）。
          # 全履歴とタグが要るのでこのジョブだけ fetch-depth: 0。
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 2026-08-22: `npm test` に mcp:test を足したが、mcp-server は
      # @modelcontextprotocol/sdk と zod を**自前の** node_modules に持つ
      # （このリポは workspaces ではなく、各パッケージが独立した lock を持つ）。
      # root の npm ci だけでは解決できず、ビルドが TS2307 で落ちる。
      # 手元では node_modules が既にあるので緑に見えていた——クリーンな
      # チェックアウトで初めて出る欠陥クラス。sdk / middleware は依存ゼロだが、
      # 将来の追加で同じ穴が空かないよう3つとも入れる。
      - name: Install package deps (sdk / middleware / mcp-server)
        run: |
          npm ci --prefix packages/sdk
          npm ci --prefix packages/middleware
          npm ci --prefix packages/mcp-server
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (scoring core + SDK)
        run: npm test
      # 2026-09-07. 提出物の文書（README / AI_USAGE / SKILL.md / CHANGED_FILES.md）に載る動く数字は
      # <!-- n:ID -->N<!-- /n --> で囲み、scripts/refresh-numbers.json の定義と突き合わせる。
      #   check: "derive"   … git だけで出る数字。ここで導出して文書と比べる（上の fetch-depth: 0 が前提）
      #   check: "recorded" … npm test 数十秒・The Graph の鍵が要る数字。印の値 == 記録値だけを見る
      # 記録値を動かせるのは `npm run refresh-numbers` だけなので、印だけ直した／JSON だけ直した／
      # 定義の無い印を足した／check の無い id、のどれもここで赤になる。
      # derive の導出は JSON の id=as_of（value=日付・end=--refresh を打った瞬間）に固定する
      # （--until='{{AS_OF_END}}' / pre-ethonline-2026..{{AS_OF_SHA}}）。同じ as_of の間は HEAD が進んでも
      # 値が変わらないので、文書を含むコミットや後続のコミットで赤にならない（旧設計は「今の HEAD」で
      # 導出し、コミットごとに 754≠755 の赤が出て refresh → commit → refresh → amend を強いていた）。
      # 数字を新しくしたいときだけ `npm run refresh-numbers`（fetch + rebase の後に）→ commit。
      - name: Submission numbers are consistent with scripts/refresh-numbers.json
        run: node scripts/refresh-numbers.mjs --check

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The only defect class tsc and the dev server both miss: route
      # conventions, the server/client boundary, and metadata generation.
      - name: Build
        run: npm run build
        env:
          # Build-time only. Nothing here reaches a real database or RPC: the
          # app is written to degrade rather than throw when they are absent,
          # and this job asserts that stays true.
          SKIP_CHAIN_READS: "1"

  # 2026-08-22. The Python SDK ships the same SpendGuard semantics as the TS
  # SDK (fail-closed on lookup failure, 10s HTTP timeout) but was not run by
  # any job — a regression there would reach PyPI unverified.
  python-sdk:
    name: python sdk tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install (editable, with test extras)
        working-directory: packages/python-sdk
        run: python -m pip install -e ".[dev]" || python -m pip install -e . pytest httpx
      - name: pytest
        working-directory: packages/python-sdk
        run: python -m pytest -q

  # 2026-08-19. The `test` job runs the pure modules with no DB, so 14 suites
  # that need Postgres SKIP there — including the two that guard the highest
  # money-risk in the product: L1 fund-path atomic reservation (the spend is on
  # the ledger BEFORE the signed request goes out) and "two overlapping batches
  # cannot spend past the daily cap" (the $49-against-$25 regression that was
  # found live, not by a test). This job spins an ephemeral Postgres so those
  # run on every push. Serial (--test-concurrency=1) because the suites TRUNCATE
  # shared tables; --test-force-exit so an open pg pool can't hang the runner.
  db-tests:
    name: db-backed integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vet402test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Push schema to the ephemeral test database
        run: npm run db:push -- --force
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vet402test
      - name: DB-backed integration tests (incl. L1 fund-path concurrency)
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vet402test

  # 2026-09-06. `examples/` は CI に一度も入っていなかった。root の `npm test` が走らせるのは
  # tests/ + sdk + middleware + mcp-server だけで、examples の suite はどのジョブからも呼ばれない。
  # そのせいで 09-05 20:04 の docs コミット（SKILL.md に決済の txHash を足した）が
  # ETHOnline の A/B ハーネスを壊したのに、誰も気づかなかった——壊れていたのは提出物そのもので、
  # 気づいたのは第三者監査だった。**走らせていないものは、緑ではなく未知である。**
  #
  # root の `npm ci` では examples の依存は入らない（このリポは workspaces ではなく、
  # 各パッケージが独立した lock を持つ）ので、明示的に入れる。
  # ethonline-2026-demo は依存ゼロ・lock 無しなので install しない（`npm ci` は lock を要求する）。
  examples:
    name: examples (ethonline-2026 ab + demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # 2026-09-06: 橋（bb7a721）の payerFromEnv は viem を動的 import する。viem はリポ直下の
      # 依存で、手元では root の node_modules から解決されるので緑に見えていた。このジョブは
      # root の npm ci をしていなかったため、clean checkout で初めて ERR_MODULE_NOT_FOUND
      # （2026-08-22 の mcp-server と同じ欠陥クラス）。README の手順（root で npm ci）と揃える。
      - name: Install root deps (parity; viem is now a direct dep of the A/B harness since 2026-09-07)
        run: npm ci
      - name: Install A/B harness deps
        run: npm ci --prefix examples/ethonline-2026-ab
      - name: A/B harness unit tests
        run: npm test --prefix examples/ethonline-2026-ab
      # 実 LLM も実 MCP も呼ばない。モックで20試行を通し、生ログを書き、
      # 書いた生ログから集計を数え直して突き合わせるところまでを毎回走らせる
      # （壊れ方が「テストは緑だが実走が落ちる」だったので、実走も関門に入れる）。
      - name: A/B harness end-to-end (mock agent, no network, no LLM)
        working-directory: examples/ethonline-2026-ab
        run: node src/cli.mjs --agent mock --out "$RUNNER_TEMP/ab-results"
      # 「テストが緑」は「テストが意味を持っている」を意味しない。わざと壊して赤くなるかを見る。
      - name: A/B harness mutation check
        run: node test-mutations.mjs
        working-directory: examples/ethonline-2026-ab
      - name: Demo CLI tests
        run: npm test --prefix examples/ethonline-2026-demo

  # 2026-09-07. 今日、緑のまま戻ってくる穴が2つ見つかった。
  #   (1) SDK の 27 変異（packages/sdk/test-mutations.mjs）は `npm run mutations` を人が打ったときしか
  #       走らず、規則を守るテストが消えても main は緑のままだった（examples ジョブが走らせるのは
  #       A/B ハーネスの変異だけ）。
  #   (2) clean clone で依存が欠けても、手元の node_modules が肩代わりして緑に見えた
  #       （08-22 の mcp-server、09-06 の viem と同じ欠陥クラスが 3 回目）。
  # どちらも「走らせていないものは緑ではなく未知」。走らせて、赤くする。
  #
  # sdk-mutations: 各変異ごとに tsc + node --test（手元 ≈ 1 変異 1 s。本数は test-mutations.mjs の MUTATIONS が正、印は n:sdk_mutations）。
  # SURVIVED（テストに守られていない規則）が 1 つでもあれば exit 1。
  sdk-mutations:
    name: sdk mutations (all must be killed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install SDK deps
        run: npm ci --prefix packages/sdk
      - name: Build SDK
        run: npm run build --prefix packages/sdk
      - name: SDK mutation check (exit 1 on any SURVIVED)
        working-directory: packages/sdk
        run: node test-mutations.mjs

  # judge-check: scripts/judge-check.sh を **checkout 直後の状態**で走らせる。審査員が clean clone で
  # 打つのと同じ手順（sdk→mcp-server→demo→root→ab、各段 npm ci から）。ここでは意図的に何も
  # 事前 install しない——node_modules が既にある状態で通しても「clean clone で通る」証明にならない。
  # 各段の終了コードはスクリプトが個別に記録し、1 段でも非 0 なら exit 1。
  # 手元の clean clone で 17〜21 s（Apple Silicon・npm cache 温）。CI は root の npm ci が重いので余裕を置く。
  judge-check:
    name: judge-check (clean checkout, no pre-install)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: bash scripts/judge-check.sh (from the repo root, nothing installed beforehand)
        run: bash scripts/judge-check.sh

  # 2026-09-05 セキュリティ監査 S-5: main は無審査 push で本番へ出る。せめて「赤い main」は
  # 10 分以内に人へ届くようにする（uptime.yml と同じ手: issue は無料でメールが飛ぶ）。
  notify-red-main:
    name: red main -> issue
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, build, python-sdk, db-tests, examples, sdk-mutations, judge-check]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI red on main"
          body="main の CI が失敗しました。commit ${SHA} / ${RUN_URL}"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

